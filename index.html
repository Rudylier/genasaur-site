  <header class="topbar">
    <div class="brand">
      <span class="wordmark" role="img" aria-label="GENASAUR"><svg class="logo-full"><use href="#logo-full"/></svg><svg class="logo-mark"><use href="#logo-mark"/></svg></span>
      <button id="btnSearchOpen" class="icon search-open-btn" title="Поиск" aria-label="Поиск"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="search" type="search" placeholder="Поиск" autocomplete="off" aria-label="Найти человека">
        <button id="btnSearchClose" class="search-close" type="button">Отмена</button>
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <span id="stats" class="stats"></span>
    </div>

    <div class="controls">
      <label class="depth" title="Сколько поколений предков показывать">
        Предки <input id="depthUp" type="number" min="1" max="8" value="4">
      </label>
      <label class="depth" title="Сколько поколений потомков показывать">
        Потомки <input id="depthDown" type="number" min="0" max="6" value="3">
      </label>
      <span id="saveState" class="save-state"></span>
      <button id="btnCancelEdit" class="cancel-btn" hidden title="Отменить все мои правки с момента входа на сайт" aria-label="Отменить правки"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Отменить</span></button>
      <div class="seg" role="tablist" aria-label="Вид">
        <button data-view="full" class="active" title="Все родственники: братья, сёстры, дяди, тёти, двоюродные, дети">Вся семья</button>
        <button data-view="hourglass" title="Линия выбранного человека: предки сверху, потомки снизу">Древо</button>
      </div>
      <button id="btnPrint" class="icon" title="Печать на A4: схема и список людей" aria-label="Печать"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="2"/><path d="M7 14h10v6.5H7z"/></svg></button>
      <button id="btnTheme" class="theme-switch" role="switch" aria-checked="true" aria-label="Тёмная тема" title="Тёмная тема"><span class="knob"><svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></span></button>
      <div class="menu">
        <button class="icon" id="btnMenu" title="Файл" aria-label="Файл"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></button>
        <div class="menu-pop" id="menuPop" hidden>
          <button data-act="import">Импорт GEDCOM или JSON…</button>
          <button data-act="export-ged">Экспорт GEDCOM</button>
          <button data-act="export-json">Экспорт JSON</button>
          <button data-act="theme" class="menu-theme">Сменить тему</button>
          <button data-act="history" id="menuHistory" hidden>История правок</button>
          <button data-act="logout" id="menuLogout" hidden>Выйти</button>
          <hr>
          <button data-act="example">Открыть пример</button>
          <button data-act="new" class="danger">Новое пустое древо</button>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">
    <svg id="canvas" aria-label="Родословное древо">
      <defs>
        <clipPath id="avatarClip"><circle r="20"/></clipPath>
      </defs>
      <g id="viewport"></g>
    </svg>

    <div id="empty" class="empty" hidden>
      <h1>Начните своё древо</h1>
      <p>Начните с себя — потом добавляйте родителей, бабушек и дедушек.<br>Или импортируйте GEDCOM из MyHeritage, Gramps или скилла исследования.</p>
      <div class="empty-actions">
        <button id="btnStart" class="primary">Добавить первого человека</button>
        <button id="btnEmptyImport">Импорт GEDCOM / JSON</button>
        <button id="btnEmptyExample">Посмотреть пример</button>
      </div>
    </div>

    <div class="zoom-ctrl">
      <button id="zoomIn" class="icon" title="Приблизить" aria-label="Приблизить"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" class="icon" title="Отдалить" aria-label="Отдалить"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="zoomFit" class="icon" title="Показать всё древо" aria-label="Показать всё древо"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="goRoot" class="icon" title="К главному человеку" aria-label="К главному человеку"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
    </div>

    <div class="legend-wrap" id="legendWrap">
      <div class="legend" id="legend" hidden></div>
      <button id="btnLegend" class="icon" title="Обозначения" aria-label="Обозначения" aria-expanded="false" aria-controls="legend"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </main>

  <aside id="panel" class="panel" hidden></aside>

  <dialog id="relDialog" class="dialog"></dialog>
  <input id="fileInput" type="file" accept=".ged,.json,.gedcom" hidden>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <div id="toast" class="toast" hidden></div>
  <div id="printView" class="print-view" aria-hidden="true"></div>
  <div id="lock" class="lock" hidden>
    <form>
      <h1 aria-label="GENASAUR"><svg class="lock-logo" aria-hidden="true"><use href="#logo-full"/></svg></h1>
      <p class="lock-hint">Введите своё имя и пароль. Их можно спросить у того, кто прислал ссылку.</p>
      <input name="user" autocomplete="username" placeholder="Имя" aria-label="Имя" autocapitalize="words" spellcheck="false">
      <div class="pass-wrap">
        <input name="pass" type="text" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="pass-eye" aria-label="Скрыть пароль" title="Скрыть пароль" aria-pressed="false"><svg class="ic eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ic eye-shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg></button>
      </div>
      <button class="primary" type="submit">Открыть</button>
      <p class="lock-err" role="alert"></p>
    </form>
  </div>

  <script src="gedcom.js?v=f3a06e1316"></script>
  <script src="app.js?v=08f27ef6d8"></script>
</body>
</html>
